name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/Palisade/Palisade.csproj

      - name: Publish self-contained single-file exe
        run: |
          dotnet publish src/Palisade/Palisade.csproj -c Release -r win-x64 `
            --self-contained -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -o publish

      - name: Smoke test (non-UI detection pass)
        run: .\publish\Palisade.exe --self-test

      - name: Checksum
        shell: pwsh
        run: |
          (Get-FileHash .\publish\Palisade.exe -Algorithm SHA256).Hash.ToLower() |
            Out-File -Encoding ascii .\publish\Palisade.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Palisade
          path: |
            publish/Palisade.exe
            publish/Palisade.exe.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Palisade.exe
            publish/Palisade.exe.sha256
          generate_release_notes: true
